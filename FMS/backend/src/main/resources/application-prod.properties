# =========================
# 生产环境（prod）
# 必须通过环境变量传入连接信息，避免明文凭据入库
# =========================

# 数据库连接
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 生产环境默认关闭 SQL 控制台日志
# 如需排障可临时通过环境变量覆盖
mybatis.configuration.log-impl=${MYBATIS_LOG_IMPL:}

# 生产环境默认关闭 Sa-Token 内部日志
sa-token.is-log=${SA_TOKEN_LOG:false}
